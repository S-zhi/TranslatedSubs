# TranslatedSubs main-service defaults.
# Keep deployment-specific changes in the ignored root config.local.toml.
config_version = 1

[paths]
data_dir = "./data"
# Empty means <data_dir>/db/app.db. Set an absolute path for a separate volume.
db_path = ""

[pipeline]
workers = 8

[service]
stream_timeout_sec = 7200
readiness_ttl_sec = 60
probe_cache_ttl_sec = 300
cors_allow_origins = [
  "http://localhost:5273",
  "http://127.0.0.1:5273",
  "http://localhost:8000",
  "http://127.0.0.1:8000",
]
max_upload_mb = 2048
max_video_minutes = 180

[download]
workers = 2
concurrent_fragments = 4
quality = "480p"
# Empty means derive the yt-dlp format from quality.
format = ""
socket_timeout = 30
proxy = ""
container = "mp4"
cookies_file = ""
allow_cookies_from_browser = false
startup_probe_enabled = true
retries = 3

[tools]
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"

[audio]
sample_rate = 16000
channels = 1

[vocal_separation]
enabled = false
backend = "demucs"
model = "htdemucs"
threads = 1
command = "python -m demucs.separate"
timeout = 1800

[transcriber]
backend = "local_whisper"
url = ""
timeout = 1800

[local_whisper]
model = "tiny"
device = "cpu"
compute_type = "int8"
download_root = ""
beam_size = 5

[replicate]
model = "stayallive/whisper-subtitles:b97ba81004e7132181864c885a76cae0e56bc61caa4190a395f6d8ba45b7a969"
timeout = 1800
retries = 3
retry_interval = 3600
poll_interval = 30

[translation]
base_url = "https://api.deepseek.com"
model = "deepseek-chat"
batch_size = 8
timeout = 60
target_languages = [
  "zh-CN", "zh-TW", "en", "ja", "ko", "es", "fr", "de", "ru", "it",
  "pt", "vi", "th", "ar", "id", "hi", "nl", "pl", "tr", "sv",
  "uk", "cs", "da", "fi", "el", "he", "hu", "no", "ro", "sk",
  "af", "ca", "bg", "hr", "ms", "fa", "ta", "sw",
]

[translation.lang_names]
auto = "the source language"
"zh-CN" = "Simplified Chinese (简体中文)"
"zh-TW" = "Traditional Chinese (繁體中文)"
