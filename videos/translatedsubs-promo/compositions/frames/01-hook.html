<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Sora";
          src: url("assets/fonts/sora-400.woff2") format("woff2");
          font-weight: 400;
          font-style: normal;
          font-display: swap;
        }
        @font-face {
          font-family: "Sora";
          src: url("assets/fonts/sora-700.woff2") format("woff2");
          font-weight: 700;
          font-style: normal;
          font-display: swap;
        }
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          color: #F5F7FF;
          font-family: "Sora", sans-serif;
          background: #080B17;
        }
        .ground {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse 48% 54% at 78% 38%, rgba(81, 230, 241, 0.12), transparent 70%),
            radial-gradient(ellipse 40% 48% at 22% 54%, rgba(124, 92, 252, 0.12), transparent 72%),
            #080B17;
        }
        .ground::after {
          content: "";
          position: absolute;
          inset: 0;
          opacity: 0.13;
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
          pointer-events: none;
        }
        .guide {
          position: absolute;
          left: 120px;
          right: 120px;
          top: 156px;
          height: 1px;
          background: linear-gradient(90deg, rgba(245,247,255,.18), rgba(245,247,255,.03) 64%, transparent);
        }
        .aperture {
          position: absolute;
          left: 1030px;
          top: 166px;
          width: 770px;
          height: 488px;
          overflow: hidden;
          border: 1px solid rgba(245, 247, 255, 0.26);
          border-radius: 24px;
          box-shadow: 0 26px 90px rgba(0, 0, 0, 0.48), 0 0 70px rgba(81, 230, 241, 0.12);
          background: #10172A;
        }
        .landscape {
          position: absolute;
          left: -1%;
          top: -2%;
          width: 102%;
          height: 104%;
          object-fit: cover;
          object-position: 50% 54%;
          transform-origin: 50% 50%;
        }
        .aperture-shade {
          position: absolute;
          inset: 0;
          background: linear-gradient(90deg, rgba(8,11,23,.05), transparent 45%, rgba(8,11,23,.18)), linear-gradient(0deg, rgba(8,11,23,.28), transparent 55%);
          pointer-events: none;
        }
        .aperture-rim {
          position: absolute;
          left: 1008px;
          top: 144px;
          width: 814px;
          height: 532px;
          border: 1px solid rgba(81, 230, 241, 0.12);
          border-radius: 32px;
          pointer-events: none;
        }
        .title-lockup {
          position: absolute;
          left: 142px;
          top: 264px;
          width: 890px;
          opacity: 0;
          transform-origin: left center;
          z-index: 3;
        }
        .title-line {
          display: block;
          white-space: nowrap;
          font-size: 83px;
          font-weight: 700;
          line-height: 1.14;
          letter-spacing: -4.6px;
          color: #F5F7FF;
        }
        .title-line.secondary {
          color: #C9D4E8;
        }
        .word-glow {
          display: inline-block;
          transform-origin: left center;
          will-change: transform, text-shadow;
        }
        .rail {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: visible;
          z-index: 4;
          pointer-events: none;
        }
        .wave-path,
        .violet-path {
          fill: none;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .wave-path {
          stroke: #51E6F1;
          stroke-width: 4;
          filter: drop-shadow(0 0 8px rgba(81,230,241,.58));
        }
        .violet-path {
          stroke: #7C5CFC;
          stroke-width: 4;
          filter: drop-shadow(0 0 8px rgba(124,92,252,.56));
        }
        .rail-base {
          stroke: rgba(245,247,255,.13);
          stroke-width: 1;
        }
        .speech-tick {
          stroke: #51E6F1;
          stroke-width: 3;
          stroke-linecap: round;
          opacity: 0;
          filter: drop-shadow(0 0 6px rgba(81,230,241,.45));
        }
        .caption-mark {
          fill: #F5F7FF;
          opacity: 0;
        }
        .caption-mark.violet {
          fill: #7C5CFC;
        }
        .edge-tick {
          stroke: rgba(245,247,255,.22);
          stroke-width: 1;
        }
      </style>

      <div id="root" data-composition-id="01-hook" data-width="1920" data-height="1080" data-duration="5">
        <div class="ground"></div>
        <div class="guide"></div>
        <div class="aperture-rim"></div>
        <div class="aperture">
          <img id="hook01-landscape" class="landscape" src="assets/demo-landscape.png" alt="Illustrative landscape" />
          <div class="aperture-shade"></div>
        </div>
        <div id="hook01-title" class="title-lockup">
          <span id="hook01-line-one" class="title-line"></span>
          <span id="hook01-line-two" class="title-line secondary"><span id="hook01-keyword" class="word-glow"></span></span>
        </div>
        <svg class="rail" viewBox="0 0 1920 1080" aria-hidden="true">
          <path class="rail-base" d="M126 758 H1794" />
          <path id="hook01-wave" class="wave-path" d="M126 758 H1794" />
          <path id="hook01-violet" class="violet-path" d="M1075 758 H1794" />
          <g id="hook01-ticks">
            <path id="hook01-tick-1" class="speech-tick" d="M390 744 V772" />
            <path id="hook01-tick-2" class="speech-tick" d="M500 738 V778" />
            <path id="hook01-tick-3" class="speech-tick" d="M610 746 V770" />
            <path id="hook01-tick-4" class="speech-tick" d="M720 735 V781" />
            <path id="hook01-tick-5" class="speech-tick" d="M830 744 V772" />
            <path id="hook01-tick-6" class="speech-tick" d="M940 738 V778" />
          </g>
          <g id="hook01-caption-marks">
            <rect id="hook01-mark-1" class="caption-mark" x="1110" y="748" width="34" height="20" rx="4" />
            <rect id="hook01-mark-2" class="caption-mark" x="1165" y="748" width="52" height="20" rx="4" />
            <rect id="hook01-mark-3" class="caption-mark violet" x="1240" y="748" width="78" height="20" rx="4" />
            <rect id="hook01-mark-4" class="caption-mark violet" x="1340" y="748" width="42" height="20" rx="4" />
            <rect id="hook01-mark-5" class="caption-mark violet" x="1404" y="748" width="96" height="20" rx="4" />
          </g>
          <path class="edge-tick" d="M126 746 V770 M1794 746 V770" />
        </svg>

        <script src="assets/vendor/gsap.min.js"></script>
        <script>
          window.__timelines = window.__timelines || {};
          const hookTimeline = gsap.timeline({ paused: true });
          const hookTitle = document.getElementById("hook01-title");
          const hookLineOne = document.getElementById("hook01-line-one");
          const hookKeyword = document.getElementById("hook01-keyword");
          const hookImage = document.getElementById("hook01-landscape");

          const phraseStates = [
            { t: 0.16, first: "EVERY VIDEO", second: "" },
            { t: 0.62, first: "EVERY VIDEO HAS A", second: "" },
            { t: 1.00, first: "EVERY VIDEO HAS A", second: "VOICE" },
            { t: 1.62, first: "MAKE IT", second: "UNDERSTOOD" },
          ];
          const phraseDriver = { t: 0 };
          let currentPhrase = "";
          hookTimeline.to(phraseDriver, {
            t: 5,
            duration: 5,
            ease: "none",
            onUpdate: () => {
              let state = phraseStates[0];
              for (let i = phraseStates.length - 1; i >= 0; i -= 1) {
                if (phraseDriver.t >= phraseStates[i].t) {
                  state = phraseStates[i];
                  break;
                }
              }
              const key = `${state.first}|${state.second}`;
              if (key !== currentPhrase) {
                hookLineOne.textContent = state.first;
                hookKeyword.textContent = state.second;
                currentPhrase = key;
              }
            },
          }, 0);

          hookTimeline.fromTo(hookImage,
            { scale: 1.055, x: -13, y: 8 },
            { scale: 1, x: 0, y: 0, duration: 1.35, ease: "power2.out" },
            0.05
          );
          hookTimeline.fromTo(hookTitle,
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.46, ease: "power2.out" },
            0.12
          );
          hookTimeline.fromTo("#hook01-wave",
            { strokeDashoffset: 1668 },
            { strokeDashoffset: 0, duration: 1.05, ease: "power2.out" },
            0.28
          );
          hookTimeline.fromTo("#hook01-line-one",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
            0.16
          );
          hookTimeline.fromTo("#hook01-line-two",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },
            0.98
          );
          hookTimeline.fromTo(hookTitle,
            { scale: 1 },
            { scale: 1.075, duration: 0.54, ease: "power2.out", immediateRender: false },
            3.60
          );
          hookTimeline.to(hookImage, { opacity: 0.72, duration: 0.4, ease: "power1.out" }, 3.60);
          hookTimeline.to(hookKeyword, { color: "#7C5CFC", duration: 0.42, ease: "power1.out" }, 3.60);

          const wavePath = document.getElementById("hook01-wave");
          const waveLength = wavePath.getTotalLength();
          wavePath.style.strokeDasharray = `${waveLength}`;
          wavePath.style.strokeDashoffset = `${waveLength}`;
          const violetPath = document.getElementById("hook01-violet");
          const violetLength = violetPath.getTotalLength();
          violetPath.style.strokeDasharray = `${violetLength}`;
          violetPath.style.strokeDashoffset = `${violetLength}`;
          hookTimeline.fromTo(violetPath,
            { strokeDashoffset: violetLength },
            { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
            3.62
          );

          const tickStarts = [2.03, 2.21, 2.39, 2.57, 2.75, 2.93];
          tickStarts.forEach((start, index) => {
            const tick = document.getElementById(`hook01-tick-${index + 1}`);
            hookTimeline.fromTo(tick,
              { opacity: 0, x: -18 },
              { opacity: 1, x: 0, duration: 0.24, ease: "power2.out" },
              start
            );
          });
          const markStarts = [2.84, 2.98, 3.12, 3.26, 3.40];
          markStarts.forEach((start, index) => {
            const mark = document.getElementById(`hook01-mark-${index + 1}`);
            hookTimeline.fromTo(mark,
              { opacity: 0, y: 8 },
              { opacity: 0.86, y: 0, duration: 0.22, ease: "power1.out" },
              start
            );
          });

          const emphasis = { t: 0 };
          const release = 0.34;
          const attack = 0.16;
          const restLevel = 0.18;
          hookTimeline.to(emphasis, {
            t: 5,
            duration: 5,
            ease: "none",
            onUpdate: () => {
              const start = 3.68;
              const end = 4.16;
              let env = 0;
              if (emphasis.t >= start && emphasis.t < end) {
                env = Math.min((emphasis.t - start) / attack, 1);
              } else if (emphasis.t >= end && emphasis.t < end + release) {
                env = 1 - ((emphasis.t - end) / release) * (1 - restLevel);
              } else if (emphasis.t >= end + release) {
                env = restLevel;
              }
              const blur = 28 * env;
              const scale = 1 + 0.16 * env;
              hookKeyword.style.textShadow = `0 0 ${blur}px rgba(124,92,252,${0.12 + 0.5 * env})`;
              hookKeyword.style.transform = `scale(${scale})`;
            },
          }, 0);

          window.__timelines["01-hook"] = hookTimeline;
        </script>
      </div>
    </template>
  </body>
</html>
