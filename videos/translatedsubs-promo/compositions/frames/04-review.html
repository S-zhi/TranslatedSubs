      <div id="root" data-composition-id="04-review" data-width="1920" data-height="1080" data-duration="8">

        <div id="review04-camera" class="camera-world">
          <div class="workbench"></div>
          <div class="panel-seam"></div>
          <div id="review04-preview-title" class="preview-title">Preview</div>
          <div id="review04-editor-title" class="editor-title">Subtitle editor</div>
          <div id="review04-interface-note" class="interface-note">Interface illustration</div>
          <div id="review04-preview-frame" class="preview-frame">
            <img id="review04-landscape" class="preview-image" src="assets/demo-landscape.png" alt="Illustrative landscape preview" />
            <div id="review04-preview-caption" class="preview-caption">
              <span class="preview-prefix">We begin at</span><span id="review04-preview-keyword" class="preview-keyword">dawn.</span>
            </div>
          </div>
          <div id="review04-editor-row" class="editor-row">
            <span class="editor-prefix">We begin at</span><span id="review04-editor-keyword" class="editor-keyword">dawn.</span><span id="review04-edit-caret" class="edit-caret"></span>
          </div>
          <div id="review04-start-field" class="field field-start">
            <span class="field-label">Start</span>
            <span id="review04-start-value" class="field-value">00:02.1</span><span id="review04-start-caret" class="field-caret"></span>
          </div>
          <div id="review04-end-field" class="field field-end">
            <span class="field-label">End</span>
            <span id="review04-end-value" class="field-value">00:04.7</span><span id="review04-end-caret" class="field-caret"></span>
          </div>
          <div id="review04-timing-track" class="timing-track"><div id="review04-timing-range" class="timing-range"></div></div>
          <svg id="review04-confirm" class="confirm-mark" viewBox="0 0 38 38" aria-hidden="true">
            <circle cx="19" cy="19" r="16" />

          </svg>
          <div id="review04-click-ring-one" class="click-ring"></div>

        <script src="assets/vendor/gsap.min.js"></script>
        <script>
          window.__timelines = window.__timelines || {};
          const reviewTimeline = gsap.timeline({ paused: true });
          const reviewCamera = document.getElementById("review04-camera");
          const reviewPointer = document.getElementById("review04-pointer");
          const reviewEditorRow = document.getElementById("review04-editor-row");
          const reviewEditorKeyword = document.getElementById("review04-editor-keyword");
          const reviewPreviewKeyword = document.getElementById("review04-preview-keyword");
          const reviewEditCaret = document.getElementById("review04-edit-caret");
          const reviewStartField = document.getElementById("review04-start-field");
          const reviewEndField = document.getElementById("review04-end-field");
          const reviewStartValue = document.getElementById("review04-start-value");
          const reviewEndValue = document.getElementById("review04-end-value");
          const reviewStartCaret = document.getElementById("review04-start-caret");
          const reviewEndCaret = document.getElementById("review04-end-caret");
          const reviewTimingRange = document.getElementById("review04-timing-range");
          const reviewConfirm = document.getElementById("review04-confirm");

          const BASE_DURATION = 0.48;
          const SEC_PER_CHAR = 0.02;
          const reviewContent = [
            { text: "We begin at dawn.", stage: "preview", hold: 1.16 },
            { text: "dawn", stage: "select", hold: 0 },
            { text: "We begin at first light.", stage: "updated", hold: 0.60 },
            { text: "00:02.3", stage: "start", hold: 0.60 },
            { text: "00:04.9", stage: "final", hold: 1.90 },
          ];
          let contentCursor = 0;
          const reviewSequence = reviewContent.map((entry) => {
            const duration = BASE_DURATION + entry.text.length * SEC_PER_CHAR + entry.hold;
            const start = contentCursor;
            contentCursor += duration;
            return { ...entry, start, end: contentCursor };
          });
          function reviewEntryAt(time) {
            for (let i = reviewSequence.length - 1; i >= 0; i -= 1) {
              if (time >= reviewSequence[i].start) return reviewSequence[i];
            }
            return reviewSequence[0];
          }
          const reviewContentDriver = { t: 0 };
          let activeStage = "";
          reviewTimeline.to(reviewContentDriver, {
            t: 8,
            duration: 8,
            ease: "none",
            onUpdate: () => {
              const entry = reviewEntryAt(reviewContentDriver.t);
              if (entry.stage === activeStage) return;
              activeStage = entry.stage;
              reviewEditorKeyword.classList.toggle("selected", activeStage === "select");
              reviewStartValue.textContent = ["start", "final"].includes(activeStage) ? "00:02.3" : "00:02.1";
              reviewEndValue.textContent = activeStage === "final" ? "00:04.9" : "00:04.7";
            },
          }, 0);

          const editStates = [
            { t: 0, suffix: "dawn." },
            { t: 2.38, suffix: "" },
            { t: 2.66, suffix: "first light." },
          ];
          const editDriver = { t: 0 };
          let shownEditState = "";
          reviewTimeline.to(editDriver, {
            t: 8,
            duration: 8,
            ease: "none",
            onUpdate: () => {
              let state = editStates[0];
              for (let i = editStates.length - 1; i >= 0; i -= 1) {
                if (editDriver.t >= editStates[i].t) {
                  state = editStates[i];
                  break;
                }
              }
              if (shownEditState === state.suffix) return;
              shownEditState = state.suffix;
              reviewEditorKeyword.textContent = state.suffix;
              reviewPreviewKeyword.textContent = state.suffix;
              reviewEditCaret.style.opacity = state.suffix === "" ? "1" : "0";
            },
          }, 0);

          reviewTimeline.fromTo("#review04-preview-title, #review04-editor-title",
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.48, ease: "power2.out", stagger: 0.12 },
            0.10
          );
          reviewTimeline.fromTo("#review04-interface-note",
            { opacity: 0, y: 8 },
            { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" },
            0.38
          );
          reviewTimeline.fromTo("#review04-preview-frame",
            { opacity: 0, scale: 0.985, y: 12 },
            { opacity: 1, scale: 1, y: 0, duration: 0.68, ease: "power2.out" },
            0.18
          );
          reviewTimeline.fromTo("#review04-landscape",
            { scale: 1.025, x: -11, y: 5 },
            { scale: 1, x: 0, y: 0, duration: 1.18, ease: "power2.out" },
            0.18
          );
          reviewTimeline.fromTo("#review04-preview-caption",
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.48, ease: "power2.out" },
            0.56
          );
          reviewTimeline.fromTo("#review04-editor-row",
            { opacity: 0, x: 16 },
            { opacity: 1, x: 0, duration: 0.58, ease: "power2.out" },
            0.42
          );
          reviewTimeline.fromTo("#review04-start-field, #review04-end-field",
            { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.50, ease: "power2.out", stagger: 0.12 },
            0.82
          );
          reviewTimeline.fromTo("#review04-timing-track",
            { opacity: 0, scaleX: 0.86 },
            { opacity: 1, scaleX: 1, duration: 0.45, ease: "power2.out" },
            1.22
          );
          reviewTimeline.fromTo(reviewPointer,
            { opacity: 0, x: 806, y: 788 },
            { opacity: 1, x: 1324, y: 358, duration: 0.92, ease: "power2.inOut" },
            0.82
          );

          // Camera follows the cursor from the selected row to the explicit timing fields.
          reviewTimeline.to(reviewCamera,
            { x: -13, y: -7, scale: 1.025, duration: 0.92, ease: "power2.inOut" },
            1.84
          );
          reviewTimeline.to(reviewCamera,
            { x: -23, y: -16, scale: 1.045, duration: 1.0, ease: "power2.inOut" },
            4.18
          );
          reviewTimeline.to(reviewCamera,
            { x: -34, y: -12, scale: 1.05, duration: 0.68, ease: "power2.inOut" },
            5.20
          );

          // Click on the subtitle row: cursor press, row response, then two expanding rings.
          reviewTimeline.to(reviewPointer, { scale: 0.86, duration: 0.08, ease: "power2.in" }, 2.02);
          reviewTimeline.to(reviewPointer, { scale: 1, duration: 0.10, ease: "power2.out" }, 2.10);
          reviewTimeline.to(reviewEditorRow,
            { scale: 0.992, duration: 0.08, ease: "power2.in" },
            2.02
          );
          reviewTimeline.to(reviewEditorRow,
            { scale: 1, duration: 0.10, ease: "power2.out" },
            2.10
          );
          reviewTimeline.to(reviewEditorRow,
            { borderColor: "rgba(255,146,122,.72)", backgroundColor: "rgba(255,146,122,.065)", duration: 0.20, ease: "power1.out" },
            2.02
          );
          reviewTimeline.to(reviewEditCaret, { opacity: 1, duration: 0.08, ease: "none" }, 2.02);
          reviewTimeline.fromTo("#review04-click-ring-one",
            { opacity: 0.72, scale: 0.22 },
            { opacity: 0, scale: 1.85, duration: 0.60, ease: "power2.out" },
            2.04
          );
          reviewTimeline.fromTo("#review04-click-ring-two",
            { opacity: 0.42, scale: 0.18 },
            { opacity: 0, scale: 2.15, duration: 0.66, ease: "power2.out" },
            2.13
          );

          // Camera chase to Start, then End; no draggable timeline or scrub handle is shown.
          reviewTimeline.to(reviewPointer,
            { x: 1106, y: 540, duration: 0.72, ease: "power2.inOut" },
            3.92
          );
          reviewTimeline.to(reviewStartField,
            { borderColor: "#FF927A", boxShadow: "0 0 0 3px rgba(255,146,122,.12)", duration: 0.22, ease: "power1.out" },
            4.24
          );
          reviewTimeline.to(reviewStartCaret, { opacity: 1, duration: 0.08, ease: "none" }, 4.26);
          reviewTimeline.to(reviewPointer, { scale: 0.86, duration: 0.08, ease: "power2.in" }, 4.38);
          reviewTimeline.to(reviewPointer, { scale: 1, duration: 0.10, ease: "power2.out" }, 4.46);
          reviewTimeline.to(reviewStartField,
            { scale: 0.99, duration: 0.08, ease: "power2.in" },
            4.38
          );
          reviewTimeline.to(reviewStartField,
            { scale: 1, duration: 0.10, ease: "power2.out" },
            4.46
          );
          reviewTimeline.to(reviewPointer,
            { x: 1508, y: 540, duration: 0.64, ease: "power2.inOut" },
            5.12
          );
          reviewTimeline.to(reviewStartField,
            { borderColor: "rgba(245,247,255,.18)", boxShadow: "0 0 0 0 rgba(255,146,122,0)", duration: 0.20, ease: "power1.out" },
            5.40
          );
          reviewTimeline.to(reviewStartCaret, { opacity: 0, duration: 0.08, ease: "none" }, 5.40);
          reviewTimeline.to(reviewEndField,
            { borderColor: "#FF927A", boxShadow: "0 0 0 3px rgba(255,146,122,.12)", duration: 0.22, ease: "power1.out" },
            5.46
          );
          reviewTimeline.to(reviewEndCaret, { opacity: 1, duration: 0.08, ease: "none" }, 5.48);
          reviewTimeline.to(reviewPointer, { scale: 0.86, duration: 0.08, ease: "power2.in" }, 5.58);
          reviewTimeline.to(reviewPointer, { scale: 1, duration: 0.10, ease: "power2.out" }, 5.66);
          reviewTimeline.to(reviewEndField,
            { scale: 0.99, duration: 0.08, ease: "power2.in" },
            5.58
          );
          reviewTimeline.to(reviewEndField,
            { scale: 1, duration: 0.10, ease: "power2.out" },
            5.66
          );
          reviewTimeline.to(reviewTimingRange,
            { x: 10, scaleX: 0.38, duration: 0.95, ease: "power2.out" },
            4.20
          );
          reviewTimeline.to(reviewEditCaret, { opacity: 0, duration: 0.18, ease: "power1.out" }, 2.86);

          reviewTimeline.fromTo(reviewConfirm,
            { opacity: 0, scale: 0.72 },
            { opacity: 1, scale: 1, duration: 0.50, ease: "power2.out" },
            6.55
          );
          reviewTimeline.to(reviewPointer, { opacity: 0, duration: 0.24, ease: "power1.out" }, 6.72);

          // A finite attack / sustain / release glow resolves on the updated subtitle phrase.
          const confirmEmphasis = { t: 0 };
          reviewTimeline.to(confirmEmphasis, {
            t: 8,
            duration: 8,
            ease: "none",
            onUpdate: () => {
              const start = 6.55;
              const end = 7.06;
              const release = 0.36;
              const rest = 0.18;
              let env = 0;
              if (confirmEmphasis.t >= start && confirmEmphasis.t < end) {
                env = Math.min((confirmEmphasis.t - start) / 0.16, 1);
              } else if (confirmEmphasis.t >= end && confirmEmphasis.t < end + release) {
                env = 1 - ((confirmEmphasis.t - end) / release) * (1 - rest);
              } else if (confirmEmphasis.t >= end + release) {
                env = rest;
              }
              reviewPreviewKeyword.style.textShadow = `0 0 ${22 * env}px rgba(124,92,252,${0.10 + env * 0.46})`;
              reviewPreviewKeyword.style.transform = `scale(${1 + 0.08 * env})`;
            },
          }, 0);

          window.__timelines["04-review"] = reviewTimeline;
        </script>

    </template>
