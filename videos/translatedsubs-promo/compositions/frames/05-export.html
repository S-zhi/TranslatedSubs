      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const draw = (selector) => {
          const path = document.querySelector(selector);
          const length = path.getTotalLength();
          path.style.strokeDasharray = `${length}`;
          path.style.strokeDashoffset = `${length}`;
          return path;
        };
        const mainRail = draw("#f05-export-main-rail");
        const fileRail = draw("#f05-export-file-rail");
        const softRail = draw("#f05-export-soft-rail");
        const burnedRail = draw("#f05-export-burned-rail");
        const mcpRail = draw("#f05-export-mcp-rail");

        const sequence = [
          { id: "#f05-export-file-output", label: "Subtitle file", hold: 0.37, targetX: 995, targetY: 285 },
          { id: "#f05-export-soft-output", label: "Soft subtitles", hold: 0.50, targetX: 1180, targetY: 489 },
          { id: "#f05-export-burned-output", label: "Burned-in captions", hold: 0.95, targetX: 1180, targetY: 680 },
          { id: "#f05-export-mcp-output", label: "MCP access", hold: 1.00, targetX: 1080, targetY: 822, localEntrance: true },
        ];
        const baseDuration = 0.42;
        const secondsPerCharacter = 0.025;
        let sequenceAt = 2.02;
        sequence.forEach((entry) => {
          const entranceDuration = 0.52;
          const contentDuration = baseDuration + entry.label.length * secondsPerCharacter + entry.hold;
          const element = document.querySelector(entry.id);
          const rect = element.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const clusterX = 700;
          const clusterY = 440;
          const startX = clusterX - centerX;
          const startY = clusterY - centerY;
          const fromState = entry.localEntrance
            ? { x: 0, y: 12, scale: 0.98, opacity: 0 }
            : { x: startX, y: startY, scale: 0.66, opacity: 0 };
          tl.fromTo(
            element,
            fromState,
            { x: 0, y: 0, scale: 1, opacity: 1, duration: entranceDuration, ease: "power3.out" },
            sequenceAt,
          );
          entry.start = sequenceAt;
          entry.end = sequenceAt + contentDuration;
          sequenceAt += contentDuration;
        });

        // Scene 1: the preview settles into a left-side source, then its cyan rail draws.
        tl.fromTo("#f05-export-origin", { x: 420, y: 22, scale: 1.13, opacity: 1 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.76, ease: "power3.out" }, 0.02);
        tl.fromTo(mainRail, { strokeDashoffset: mainRail.getTotalLength() }, { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" }, 0.72);
        tl.fromTo("#f05-export-junction", { scale: 0.45, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(1.45)" }, 1.20);

        // Branches trace as their matching outputs assemble out from the junction.
        tl.fromTo(fileRail, { strokeDashoffset: fileRail.getTotalLength() }, { strokeDashoffset: 0, duration: 0.54, ease: "power2.out" }, sequence[0].start - 0.14);
        tl.fromTo("#f05-export-node-one", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.4)" }, sequence[0].start + 0.12);
        tl.fromTo(softRail, { strokeDashoffset: softRail.getTotalLength() }, { strokeDashoffset: 0, duration: 0.56, ease: "power2.out" }, sequence[1].start - 0.14);
        tl.fromTo("#f05-export-node-two", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.4)" }, sequence[1].start + 0.12);
        tl.fromTo(burnedRail, { strokeDashoffset: burnedRail.getTotalLength() }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, sequence[2].start - 0.14);
        tl.fromTo("#f05-export-node-three", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.4)" }, sequence[2].start + 0.12);
        tl.to([fileRail, softRail, burnedRail], { stroke: "#7C5CFC", duration: 0.32, ease: "power1.out" }, sequence[2].start + 0.52);

        // The third media treatment contains its English caption in the picture itself.
        tl.fromTo(".embedded-caption", { opacity: 0, y: 7 }, { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" }, sequence[2].start + 0.16);

        // MCP is a slimmer tool connector branch, visually distinct from the three media outputs.
        tl.fromTo(mcpRail, { strokeDashoffset: mcpRail.getTotalLength() }, { strokeDashoffset: 0, duration: 0.54, ease: "power2.out" }, sequence[3].start - 0.16);
        tl.fromTo("#f05-export-node-mcp", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.4)" }, sequence[3].start + 0.08);

        window.__timelines["05-export"] = tl;
      </script>
