      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const cyanRail = document.querySelector("#f06-close-rail-cyan");
        const violetRail = document.querySelector("#f06-close-rail-violet");
        const cyanLength = cyanRail.getTotalLength();
        const violetLength = violetRail.getTotalLength();
        cyanRail.style.strokeDasharray = cyanLength;
        cyanRail.style.strokeDashoffset = cyanLength;
        violetRail.style.strokeDasharray = violetLength;
        violetRail.style.strokeDashoffset = violetLength;

        // The unchanged mark lands early; two subtitle rails draw toward one meeting point.
        tl.fromTo("#f06-close-logo", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.38, ease: "power2.out" }, 0.04);
        tl.fromTo(cyanRail, { strokeDashoffset: cyanLength }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, 0.12);
        tl.fromTo(violetRail, { strokeDashoffset: violetLength }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, 0.12);
        tl.fromTo("#f06-close-convergence", { autoAlpha: 0, scale: 0.65 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 1.08);

        const letters = document.querySelectorAll("#f06-close-wordmark .letter");
        letters.forEach((letter, index) => {
          tl.fromTo(letter, { autoAlpha: 0, x: 12 }, { autoAlpha: 1, x: 0, duration: 0.24, ease: "power2.out" }, 1.5 + index * 0.045);
        });
        tl.fromTo("#f06-close-tagline", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.52, ease: "power2.out" }, 2.47);
        tl.fromTo("#f06-close-cta", { autoAlpha: 0, scale: 0.9, y: 12 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.58, ease: "power3.out" }, 3.24);
        tl.fromTo("#f06-close-coral", { autoAlpha: 0, scale: 0.5, boxShadow: "0 0 0 rgba(255,146,122,0)" }, { autoAlpha: 1, scale: 1, boxShadow: "0 0 18px rgba(255,146,122,0.52)", duration: 0.3, ease: "power2.out" }, 3.86);
        tl.to("#f06-close-coral", { boxShadow: "0 0 8px rgba(255,146,122,0.28)", duration: 0.25, ease: "power1.out" }, 4.16);

        window.__timelines["06-close"] = tl;
