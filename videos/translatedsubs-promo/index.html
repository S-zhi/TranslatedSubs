<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #080B17;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="5"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-hook-voice"
        src="assets/audio/voice/frame-01.wav"
        data-start="0"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-import"
        class="scene"
        data-composition-id="02-import"
        data-composition-src="compositions/frames/02-import.html"
        data-start="5"
        data-duration="6.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-import-voice"
        src="assets/audio/voice/frame-02.wav"
        data-start="5"
        data-duration="6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-process"
        class="scene"
        data-composition-id="03-process"
        data-composition-src="compositions/frames/03-process.html"
        data-start="11"
        data-duration="8.5"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-process-voice"
        src="assets/audio/voice/frame-03.wav"
        data-start="11"
        data-duration="8"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-review"
        class="scene"
        data-composition-id="04-review"
        data-composition-src="compositions/frames/04-review.html"
        data-start="19"
        data-duration="8"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-review-voice"
        src="assets/audio/voice/frame-04.wav"
        data-start="19"
        data-duration="8"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-export"
        class="scene"
        data-composition-id="05-export"
        data-composition-src="compositions/frames/05-export.html"
        data-start="27"
        data-duration="8.5"
        data-track-index="0"
      ></div>
      <audio
        id="el-05-export-voice"
        src="assets/audio/voice/frame-05.wav"
        data-start="27"
        data-duration="8"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-06-close"
        class="scene"
        data-composition-id="06-close"
        data-composition-src="compositions/frames/06-close.html"
        data-start="35"
        data-duration="5"
        data-track-index="1"
      ></div>
      <audio
        id="el-06-close-voice"
        src="assets/audio/voice/frame-06.wav"
        data-start="35"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/promo-bed.mp3"
        data-start="0"
        data-duration="40"
        data-track-index="11"
        data-volume="1"
      ></audio>

      <!-- SFX -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/prepared/frame-02-ui-click.wav"
        data-start="10.19"
        data-duration="0.576"
        data-track-index="20"
        data-volume="0.12"
      ></audio>
      <audio
        id="el-sfx-1"
        src="assets/sfx/prepared/frame-03-process-tick-a.wav"
        data-start="13.02"
        data-duration="0.34"
        data-track-index="21"
        data-volume="0.11"
      ></audio>
      <audio
        id="el-sfx-2"
        src="assets/sfx/prepared/frame-03-process-tick-b.wav"
        data-start="15.52"
        data-duration="0.32"
        data-track-index="22"
        data-volume="0.11"
      ></audio>
      <audio
        id="el-sfx-3"
        src="assets/sfx/prepared/frame-04-edit-confirmation.wav"
        data-start="21.02"
        data-duration="0.24"
        data-track-index="23"
        data-volume="0.1"
      ></audio>
      <audio
        id="el-sfx-4"
        src="assets/sfx/prepared/frame-05-export-handoff.wav"
        data-start="31.4"
        data-duration="0.9"
        data-track-index="24"
        data-volume="0.11"
      ></audio>
      <audio
        id="el-sfx-5"
        src="assets/sfx/prepared/frame-06-brand-resolve.wav"
        data-start="38.24"
        data-duration="1"
        data-track-index="25"
        data-volume="0.1"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-import", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 11);
        tl.fromTo("#el-03-process", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 11);
        tl.to("#el-03-process", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 19);
        tl.fromTo("#el-04-review", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 19);
        tl.to("#el-05-export", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 35);
        tl.fromTo("#el-06-close", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 35);
        tl.to({}, { duration: 40 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
